#@TYPE: Machine
#@NAME: up-xtreme-arl

#@DESCRIPTION: Machine configuration for AAEON UP Xtreme ARL (UPX-ARL01,
#@ Intel Core Ultra 200H / Arrow Lake-H) systems

PREFERRED_PROVIDER_virtual/kernel ?= "linux-intel"
PREFERRED_VERSION_linux-intel ?= "6.18%"

require conf/machine/include/up-common.inc

# HAT SPI spidev on \_SB.PC00.SPI0 CS0/CS1 — verified on live UPX-ARL01
# (Ubuntu acpi-upgrades + /sys firmware_node path).
ACPI_TABLES ?= "upxtreme-arl-spidev1.0.asl upxtreme-arl-spidev1.1.asl"
INITRD_LIVE:prepend = "${DEPLOY_DIR_IMAGE}/acpi-tables.cpio "
EXTRA_IMAGEDEPENDS:append = " acpi-tables"

# Arc graphics (DRM_XE) needs broader firmware than linux-firmware-i915 alone;
# NPU matches i14 packaging. Keep BAD_RECOMMENDATIONS to avoid VPU blob clash.
IMAGE_INSTALL:append = " npu-firmware linux-firmware"

# MIPI-CSI 61-pin FPC present on this board
IMAGE_INSTALL:append = " linux-firmware-intel-ipu6-isys"

APPEND:append = " console=tty0"

BAD_RECOMMENDATIONS:append = " linux-firmware-intel-vpu linux-firmware-intel-vpu-license"
