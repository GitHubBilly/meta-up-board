#@TYPE: Machine
#@NAME: up-nexus-wcl

#@DESCRIPTION: Machine configuration for AAEON UP Nexus WCL (Intel Core Series 3,
#@ formerly Wildcat Lake) systems

PREFERRED_PROVIDER_virtual/kernel ?= "linux-intel"
PREFERRED_VERSION_linux-intel ?= "6.18%"

require conf/machine/include/up-common.inc

# Onboard storage is UFS (up to 256GB), not eMMC/SATA - see ufs.cfg in the
# linux-intel_6.18.bbappend for the kernel config needed to detect it.

# Board-specific SSDT (same \_SB.PC00.SPI0 / Shared body as i14's
# pc00.spi0.spidev1.0.asl). Dedicated file so i14 SPI edits do not affect WCL.
# DSDT dump confirms BIOS exposes \_SB.PC00.SPI0 — see docs/up-nexus-wcl/.
# Runtime (2026-10-12): /dev/spidev0.0 appears.
# Note: early boot may warn MAX_CPIO_FILE_NAME (path >18 chars) — non-blocking.
ACPI_TABLES ?= "upnexus-wcl-spidev1.0.asl"
INITRD_LIVE:prepend = "${DEPLOY_DIR_IMAGE}/acpi-tables.cpio "
EXTRA_IMAGEDEPENDS:append = " acpi-tables"

# npu-firmware + full linux-firmware for Xe3 GuC/HuC (HDMI).
# up-common.inc only recommends linux-firmware-i915 and :remove's the umbrella
# linux-firmware package — insufficient for Wildcat Lake / DRM_XE display.
# Force umbrella via IMAGE_INSTALL (survives MACHINE_EXTRA_RRECOMMENDS:remove).
# Aligns with Louis wcl_wrynose bring-up for GPU firmware coverage.
IMAGE_INSTALL:append = " npu-firmware linux-firmware"

# Prefer HDMI text console in addition to SERIAL_CONSOLES (ttyS0) from up-common.
APPEND:append = " console=tty0"

# Umbrella linux-firmware recommends linux-firmware-intel-vpu, which ships the
# same intel/vpu/vpu_37xx_v0.0.bin as npu-firmware → opkg file clash.
BAD_RECOMMENDATIONS:append = " linux-firmware-intel-vpu linux-firmware-intel-vpu-license"
