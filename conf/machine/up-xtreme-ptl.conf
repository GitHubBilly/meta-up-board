#@TYPE: Machine
#@NAME: up-xtreme-ptl

#@DESCRIPTION: Machine configuration for AAEON UP Xtreme PTL (UPX-PTL01-SYS,
#@ Intel Core Ultra Series 3 / Panther Lake-H) systems

PREFERRED_PROVIDER_virtual/kernel ?= "linux-intel"
PREFERRED_VERSION_linux-intel ?= "6.18%"

require conf/machine/include/up-common.inc

# HAT SPI spidev on \_SB.PC00.SPI0 CS0/CS1 — verified on live UPX-PTL01-SYS
# (ACPI SPT0001:00/01 paths TP0_/TP1_).
ACPI_TABLES ?= "upxtreme-ptl-spidev1.0.asl upxtreme-ptl-spidev1.1.asl"
INITRD_LIVE:prepend = "${DEPLOY_DIR_IMAGE}/acpi-tables.cpio "
EXTRA_IMAGEDEPENDS:append = " acpi-tables"

# Arc graphics (DRM_XE / Xe3) needs broader firmware than linux-firmware-i915 alone;
# NPU matches i14/ARL packaging. Keep BAD_RECOMMENDATIONS to avoid VPU blob clash.
IMAGE_INSTALL:append = " npu-firmware linux-firmware"

# MIPI-CSI 61-pin FPC present on this board family
IMAGE_INSTALL:append = " linux-firmware-intel-ipu6-isys"

APPEND:append = " console=tty0"

BAD_RECOMMENDATIONS:append = " linux-firmware-intel-vpu linux-firmware-intel-vpu-license"
